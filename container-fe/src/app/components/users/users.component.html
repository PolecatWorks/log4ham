<div>

<p>users works!</p>

<div class="mat-elevation-z8">

    <p>User Ids: {{ userIds | json  }}</p>
    <p>Log Ids: {{ logIds | json  }}</p>

</div>

<p>
    <button (click)="getUserIds()">Reload Users</button>
    <button (click)="usersGetDetail()">Users Detail</button>
    <button (click)="usersCreate('Ben', 'Greene', 'abc')">Add Ben</button>
</p>
</div>

<div class="content-wrapper">
    <div class="mat-elevation-z8">
        <table mat-table [dataSource]="data" class="mat-elevation-z8">

            <!--- Note that these columns can be defined in any order.
                The actual rendered columns are set as a property on the row definition" -->

            <!-- Position Column -->
            <ng-container matColumnDef="forename">
            <th mat-header-cell *matHeaderCellDef> Forename </th>
            <td mat-cell *matCellDef="let element"> {{element.forename}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="surname">
            <th mat-header-cell *matHeaderCellDef> Surname </th>
            <td mat-cell *matCellDef="let element"> {{element.surname}} </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator
            [pageSizeOptions]="[5, 10, 20]"
            showFirstLastButtons
            aria-label="Select page of periodic elements">
            <!-- [pageIndex] = "page.pagination.page" -->
        </mat-paginator>
    </div>
</div>
